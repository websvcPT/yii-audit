# Local test stack. The credentials below belong to a throwaway database and are not used anywhere else.
services:
  php:
    image: yiisoftware/yii2-php:8.4-fpm
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: mysql
      DB_USER: audit
      DB_PASSWORD: audit
      DB_APP: audit_app
      DB_AUDIT: audit_log
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./tests/docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 60
